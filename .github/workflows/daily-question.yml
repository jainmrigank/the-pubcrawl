name: Legacy push diagnostic

# Production scheduling moved to the expiry-aware Cloudflare campaign. This
# workflow is intentionally manual and dry-run only.
on:
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install push sender dependencies
        run: npm ci --ignore-scripts

      - name: Verify campaign selection without sending
        run: node scripts/send_push_notifications.mjs --dry-run
