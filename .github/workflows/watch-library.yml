name: Grow the watch library

# Weekly: sweep every trusted channel's RSS feed for new uploads, then prune
# what died or never found an audience. On the first Monday of a month, also
# run keyword discovery through the YouTube Data API to find new channels.
#
# Nothing here commits to main. Changes land as a pull request so the titles
# get a human read before they reach anyone's screen, which is the only thing
# standing between the library and a Hangover clip farm.
on:
  schedule:
    - cron: '0 5 * * 1' # Monday, 05:00 UTC, an hour before the stats refresh
  workflow_dispatch:
    inputs:
      discover:
        description: 'Also run keyword discovery (uses YouTube API quota)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep trusted channels for new uploads
        run: node scripts/sweep_channels.mjs --days 14

      - name: Sweep trusted channels for new Shorts
        run: node scripts/sweep_shorts.mjs --days 14 --perchannel 2 --max 12

      # Only on the first Monday of the month, or when asked by hand. search.list
      # costs 100 quota units a call, so this is not a weekly habit.
      - name: Decide whether to run discovery
        id: when
        run: |
          day=$(date -u +%d)
          if [ "${{ github.event.inputs.discover }}" = "true" ] || [ "$day" -le 07 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover new channels
        if: steps.when.outputs.run == 'yes' && env.YOUTUBE_API_KEY != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/discover_videos.mjs --queries 40

      - name: Discover new Shorts
        if: steps.when.outputs.run == 'yes' && env.YOUTUBE_API_KEY != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/discover_shorts.mjs --queries 20 --max 12

      # Health must run before pruning so the review PR contains confirmed
      # removals from both catalogues. This runs as a standalone job rather
      # than waking the Render compatibility server through an HTTP endpoint.
      - name: Refresh live Watch and Shorts health before pruning
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/refresh_video_stats.mjs

      - name: Prune the dead and the stagnant
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: node scripts/prune_watchlist.mjs

      - name: Prune dead and stale Shorts
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: node scripts/prune_shorts.mjs --days 120

      - name: Guard the reviewed Shorts catalogue
        run: node --test test/shorts.test.mjs

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/watchlist.json data/shorts.json; then
            echo "No change to the library."
            exit 0
          fi

          watch_added=$(git diff -- data/watchlist.json | grep -c '^+ *"id"' || true)
          watch_gone=$(git diff -- data/watchlist.json | grep -c '^- *"id"' || true)
          short_added=$(git diff -- data/shorts.json | grep -c '^+ *"id"' || true)
          short_gone=$(git diff -- data/shorts.json | grep -c '^- *"id"' || true)
          total=$(node -e "console.log(require('./data/watchlist.json').videos.length)")
          short_total=$(node -e "console.log(require('./data/shorts.json').shorts.length)")
          branch="watch-library/$(date -u +%Y-%m-%d)"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add data/watchlist.json data/shorts.json
          git commit -m "Watch + Shorts library: +${watch_added}/-${watch_gone} Watch, +${short_added}/-${short_gone} Shorts"
          git push -f origin "$branch"

          # reuse the open PR for this branch if there is one
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main --head "$branch" \
              --title "Watch + Shorts library: +${watch_added}/-${watch_gone} Watch, +${short_added}/-${short_gone} Shorts" \
              --body "$(printf 'Automated Watch and Shorts sweep of the trusted channels, plus a prune of dead and stale entries.\n\nWatch: +%s / -%s\nShorts: +%s / -%s\nWatch library: %s videos\nShorts library: %s Shorts\n\nSkim titles before merging. Everything passed the topic filters and the Shorts check, but no filter has taste.' "$watch_added" "$watch_gone" "$short_added" "$short_gone" "$total" "$short_total")"
          fi
