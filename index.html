<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23161512'/%3E%3Cg stroke='%23ECE9E0' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 15 Q32 20 51 14'/%3E%3Cpath d='M13.5 15.5 Q23 27 31.5 37.5'/%3E%3Cpath d='M50.5 14.5 Q41 26.5 32.5 37.5'/%3E%3Cpath d='M32 38 Q32.6 43 31.7 49'/%3E%3Cpath d='M22 51.5 Q32 49.5 42.5 51'/%3E%3Ccircle cx='40' cy='23' r='3'/%3E%3Cpath d='M40 20 Q42.5 15.5 46 13'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>The PubCrawl — what's your poison?</title>
    <meta name="description" content="What's your poison? Every cocktail you can make with what's on your shelf." />
    <meta name="theme-color" content="#1d2521" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PubCrawl" />
    <script>
      (() => {
        const key = 'pubcrawl.theme';
        let stored = null;
        try { stored = localStorage.getItem(key); } catch (_) {}
        const valid = stored === 'light' || stored === 'dark';
        // Match the device before first paint; an explicit choice wins.
        const dark = valid ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#1d2521' : '#f0e9dc';
        const apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (apple) apple.content = theme === 'dark' ? 'black-translucent' : 'default';
      })();
    </script>
    <link rel="preload" href="/fonts/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
